<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rtu-eteeap-admin - Follow Ups</title>
    <link rel="icon" href="../../img/RTU Logo.png" type="image/x-icon">
    <link rel="stylesheet" href="followup.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"/>
</head>
<body>
     <div class="container">
    <!--Sidebar--->
    <div class="sidebar">
      <div class="logo">
        <img src="../IFLDE Logo.png" class="iflde">
        ETEEAP
      </div>
      <div class="nav-item" data-section="dashboard">
        <a href="../dashboard/dashboard.html">
        <i class="fas fa-chart-pie"></i>
        Dashboard
      </a>
      </div>
      <div class="nav-item" data-section="students">
        <a href="../applicants/applicants.html">
        <i class="fas fa-users"></i>
        Applicants
      </a>
      </div>
      <div class="nav-item" data-section="assessors">
        <a href="../assessors/assessor.html">
        <i class="fas fa-users"></i>
        Assessors
      </a>
      </div>

      <div class="nav-item" data-section="courses">
        <a href="../courses/course.html">
        <i class="fas fa-book"></i>
        Courses
      </a>
      </div>

      <div class="nav-item" data-section="files">
        <a href="../documents/docs.html">
        <i class="fas fa-file"></i>
        Files
      </a>
      </div>

      <div class="nav-item" data-section="users">
        <a href="../admins/admin.html">
        <i class="fas fa-user"></i>
        Admins
      </a>
      </div>

      <div class="nav-item" data-section="logs">
        <a href="../activitylogs/logs.html">
        <i class="fas fa-clock"></i>
        Activity Logs
      </a>
      </div>

      <div class="nav-item active" data-section="followups">
        <a href="../followups/followups.html">
        <i class="fas fa-comments"></i>
        Follow-Up
      </a>
      </div>
    </div>

   <!--Main Content-->
   <div class="main-content">
    <!-- Header -->
    <div class="header">
      <div class="search-bar">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search conversations..." id="searchInput" />
      </div>
      
      <div class="user-profile">
        <div class="profile-dropdown">
          <div class="user-avatar">
            <i class="fas fa-user"></i>
          </div>
          <span class="username">Admin</span>
          <i class="fas fa-caret-down dropdown-toggle"></i>
          <div class="dropdown-menu">
            <a href="/fontend/client/admins/adminprofile/adminprofile.html" class="dropdown-item">
              <i class="fas fa-user"></i>
              Profile
            </a>
            <a href="#" class="dropdown-item">
              <i class="fas fa-cog"></i>
              Settings
            </a>
             <a href="/client/applicant/login/login.html" class="dropdown-item" id="logoutLink">
              <i class="fas fa-sign-out-alt"></i>
              Logout
            </a>
          </div>
        </div>
      </div>
    </div>

   <!-- Messaging Section -->
    <div id="followupsSection" class="section active">
        <div class="messaging-section">
            <div class="conversation-list">
                <div class="conversation-header">Follow-Up</div>
                <!-- Conversation items will be populated by backend -->
            </div>
            
            <div class="message-area">
                <div class="message-header">
                    <span id="applicantInfo">Select a conversation</span>
                    <button class="view-files-button" id="viewFilesButton">
                        <i class="fas fa-file-alt"></i> View Submitted Files
                    </button>
                </div>
                
                <!-- Files Panel (initially hidden) -->
                <div class="files-panel" id="filesPanel">
                    <div class="files-header">
                        <h3>Submitted Documents</h3>
                        <button class="close-files" id="closeFilesButton">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div class="files-list" id="filesList">
                        <!-- Files will be populated by backend -->
                    </div>
                </div>
                
                <div class="messages-container" id="messagesContainer">
                    <!-- Messages will be populated by backend -->
                </div>
                
                <div class="message-input-area">
                    <textarea class="message-input" placeholder="Admin view only - replies disabled" id="messageInput" readonly></textarea>
                    <button class="send-button" id="sendButton" disabled>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="loading-spinner" id="loadingSpinner">
        <div class="spinner"></div>
    </div>
    
    <div class="notification" id="notification"></div>

    </body>
</html>
