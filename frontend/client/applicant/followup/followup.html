<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Follow-Up Message</title>
  <link rel="stylesheet" href="followup.css"/>
  <link rel="stylesheet" href="../../shared/js/common/navprofile.css"/>
  <link rel="icon" type="image/x-icon" href="../img/RTU Logo.png"/>

  <!-- Icons -->
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
</head>

<body>
  <!-- Header -->
  <header>
    <div class="logo-container">
      <img src="../img/RTU Logo.png" class="logo1" />
      <img src="../img/IFLDE Logo.png" class="logo2" />
      <div class="logo-text-container">
        <h2 class="logo-text">Rizal Technological University</h2>
        <p class="logo-subtext">Institute of Flexible Learning & Digital Education</p>
      </div>
      <nav class="nav">
        <ul>
          <li><a href="../Timeline/timeline.html">Home</a></li>
          <li><a href="../Portfolio/portfolio.html">Portfolio</a></li>
          <li><a href="../Followup/followup.html" class="active">Follow-Up</a></li>
          <li class="profile dropdown">
            <a href="#" class="dropdown-toggle">
              <img id="nav-profile-pic" class="nav-profile-pic" src="../img/default.jpg" alt="Profile"/>
              <span id="nav-profile-name">Applicant</span>
            </a>
            <div class="dropdown-content profile-dropdown">
              <a href="../Profile/profile.html"><i class="fa-solid fa-user"></i> Profile</a>
              <a href="#" id="logout"><i class="fa-solid fa-sign-out-alt"></i> Logout</a>
            </div>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="followup-container fade-in">
    <h1 class="form-title slide-down">Submit Follow-Up Message</h1>
    <form id="followupForm" class="followup-form" enctype="multipart/form-data">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Enter your full name" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email" required />

      <label for="message">Message</label>
      <textarea id="message" rows="6" placeholder="Type your follow-up message here..." required></textarea>

      <!-- New attachments field -->
      <label for="attachments">Attach Documents / Images</label>
      <input
        type="file"
        id="attachments"
        name="attachments"
        accept=".pdf,.doc,.docx,image/*"
        multiple
      />

      <button type="submit">Send Message</button>
    </form>

    <div id="confirmation">
      <i class="fa-solid fa-circle-check"></i> Message successfully sent!
    </div>
  </main>

  <script src="../../shared/js/common/navprofile.js"></script>
  <script src="followup.js"></script>
</body>
</html>
